name: CD Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'           # Version tags (e.g., v1.0.0)
      - 'v[0-9]+.[0-9]+.[0-9]+-beta[0-9]*'  # Beta tags (e.g., v1.0.0-beta1)
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]*'   # RC tags (e.g., v1.0.0-rc1)
    branches:
      - main
      - release/*

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy'
        required: false
        default: ''
        type: string

# Environment variables
env:
  DOCKER_IMAGE_NAME: letmeqc
  DOCKER_REGISTRY: ghcr.io
  STAGING_IMAGE_TAG: latest

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (if configured)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
        if: secrets.DOCKER_HUB_USERNAME && secrets.DOCKER_HUB_TOKEN

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}
            ${{ secrets.DOCKER_HUB_USERNAME && format('{0}/{1}', secrets.DOCKER_HUB_USERNAME, env.DOCKER_IMAGE_NAME) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.STAGING_IMAGE_TAG }},enable={{is_default_branch}}

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to Docker Hub (if configured)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ secrets.DOCKER_HUB_USERNAME && secrets.DOCKER_HUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
        if: secrets.DOCKER_HUB_USERNAME && secrets.DOCKER_HUB_TOKEN

      - name: Output image information
        run: |
          echo "Docker image pushed successfully!"
          echo "GitHub Container Registry: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
          ${{ secrets.DOCKER_HUB_USERNAME && format('echo "Docker Hub: {0}/{1}:latest"', secrets.DOCKER_HUB_USERNAME, env.DOCKER_IMAGE_NAME) || '' }}


  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.letmeqc.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || '22' }}
          script: |
            cd /opt/letmeqc
            docker-compose down || true
            docker-compose pull
            docker-compose up -d --build
            docker system prune -f
            echo "Staging deployment complete!"

      - name: Wait for service to be healthy
        run: |
          # Poll health endpoint for up to 2 minutes
          for i in {1..24}; do
            if curl -f -I "https://staging.letmeqc.example.com/health" 2>/dev/null; then
              echo "Service is healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "Service did not become healthy in time"
          exit 1

      - name: Run smoke tests on staging
        run: |
          # Simple smoke test
          response=$(curl -s https://staging.letmeqc.example.com/health)
          if [[ "$response" == *"healthy"* ]]; then
            echo "Staging smoke test passed!"
          else
            echo "Staging smoke test failed!"
            echo "Response: $response"
            exit 1
          fi


  deploy-production:
    name: Deploy to Production
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://letmeqc.example.com

    # Require manual approval for production deployment
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'production'

    steps:
      - name: Wait for manual approval
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
        run: echo "Waiting for manual approval..."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || '22' }}
          script: |
            cd /opt/letmeqc
            docker-compose down || true
            docker-compose pull
            docker-compose up -d --build
            docker system prune -f
            echo "Production deployment complete!"

      - name: Wait for service to be healthy
        run: |
          for i in {1..24}; do
            if curl -f -I "https://letmeqc.example.com/health" 2>/dev/null; then
              echo "Service is healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "Service did not become healthy in time"
          exit 1

      - name: Notify deployment success
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: good
          SLACK_TITLE: "Production Deployment Successful"
          SLACK_MESSAGE: "LetmeQC v${{ github.ref_name }} deployed to production"
        if: success()

      - name: Notify deployment failure
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: danger
          SLACK_TITLE: "Production Deployment Failed"
          SLACK_MESSAGE: "Failed to deploy LetmeQC to production"
        if: failure()


  # Cleanup old images
  cleanup:
    name: Cleanup Old Docker Images
    needs: deploy-production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old images
        run: |
          # Keep last 10 tags
          IMAGE_NAME="${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}"
          
          # Get list of tags sorted by creation date
          TAGS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/${{ env.DOCKER_IMAGE_NAME }}/versions?per_page=100" \
            | jq -r '.[].metadata.container.tags[]' | grep -v "^sha-" | sort -u | head -n -10)
          
          # Delete old tags
          for tag in $TAGS; do
            echo "Deleting tag: $tag"
            curl -X DELETE -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/users/${{ github.repository_owner }}/packages/container/${{ env.DOCKER_IMAGE_NAME }}/versions/$tag"
          done
