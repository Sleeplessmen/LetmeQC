name: CI Pipeline

on:
  pull_request:
    branches: [ main, develop, feature/* ]
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'

# Cancel previous runs when new commits are pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Check Python version
        run: python --version

      - name: Install pre-commit (for linting checks)
        run: pip install pre-commit

      - name: Run pre-commit checks
        run: |
          # Only check files that are staged or changed
          pre-commit run --all-files || true

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ --max-line-length=120 --extend-ignore=E203,W503,E501

      - name: Check type hints with mypy
        run: |
          pip install mypy
          mypy src/ --ignore-missing-imports --disallow-untyped-defs --disallow-incomplete-defs

      - name: Run tests with pytest
        run: |
          pip install pytest pytest-cov
          pytest tests/ --cov=src --cov-report=xml --cov-report=html -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        if: matrix.python-version == '3.10' && github.event_name == 'push'


  # Separate job for Docker build testing
  docker-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (if available)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
        if: secrets.DOCKER_HUB_USERNAME && secrets.DOCKER_HUB_TOKEN

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: letmeqc:test
          push: false
          load: true

      - name: Run container health check
        run: |
          docker run --rm letmeqc:test sh -c "python -c 'from app import app; print(\"Import successful\")'"

      - name: Run container smoke test
        run: |
          docker run --rm -d -p 8000:8000 --name test-container letmeqc:test
          sleep 5
          curl -f http://localhost:8000/health || true
          docker stop test-container || true
          docker rm test-container || true


  # Security scanning job
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install safety pip-audit

      - name: Run Safety check
        run: safety check --full-report

      - name: Run pip-audit
        run: pip-audit --strict

      - name: Run Bandit security linter
        run: |
          pip install bandit
          bandit -r src/ -ll -ii


  # Code quality job
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install radon pylint

      - name: Run Pylint
        run: |
          pylint src/ --max-line-length=120 --disable=C0114,C0115,C0116,E0401,E1101,R0901,R0903,R0911,R0912,R0913,R0914,R0915

      - name: Check code complexity with Radon
        run: |
          radon cc src/ -a --max=10
          radon mi src/ -s --min=60
